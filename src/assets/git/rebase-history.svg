<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Git rebase before and after</title>
  <desc id="desc">A simple diagram comparing branch history before rebase and after rebase.</desc>
  <style>
    .bg { fill: #f8f6ef; }
    .title { font: 700 28px Georgia, serif; fill: #1f2937; }
    .label { font: 600 18px Georgia, serif; fill: #1f2937; }
    .text { font: 15px Georgia, serif; fill: #374151; }
    .mainline { stroke: #1f2937; stroke-width: 4; fill: none; }
    .branchline { stroke: #b45309; stroke-width: 4; fill: none; }
    .commit-main { fill: #2563eb; }
    .commit-feature { fill: #d97706; }
    .commit-rebased { fill: #059669; }
    .commit-text { font: 700 13px Menlo, monospace; fill: white; text-anchor: middle; dominant-baseline: middle; }
    .note { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; rx: 10; ry: 10; }
  </style>

  <rect class="bg" x="0" y="0" width="980" height="520"/>

  <text class="title" x="40" y="50">Git Rebase: before and after</text>

  <text class="label" x="40" y="95">Before rebase</text>
  <path class="mainline" d="M60 170 H430"/>
  <path class="branchline" d="M190 170 V125 H360"/>

  <circle class="commit-main" cx="100" cy="170" r="20"/>
  <text class="commit-text" x="100" y="170">A</text>
  <circle class="commit-main" cx="190" cy="170" r="20"/>
  <text class="commit-text" x="190" y="170">B</text>
  <circle class="commit-main" cx="300" cy="170" r="20"/>
  <text class="commit-text" x="300" y="170">C</text>
  <circle class="commit-main" cx="390" cy="170" r="20"/>
  <text class="commit-text" x="390" y="170">D</text>

  <circle class="commit-feature" cx="260" cy="125" r="20"/>
  <text class="commit-text" x="260" y="125">F1</text>
  <circle class="commit-feature" cx="340" cy="125" r="20"/>
  <text class="commit-text" x="340" y="125">F2</text>

  <text class="text" x="445" y="174">`main` moved forward after the branch was created</text>
  <text class="text" x="370" y="129">feature branch</text>

  <text class="label" x="40" y="290">After rebase</text>
  <path class="mainline" d="M60 365 H700"/>

  <circle class="commit-main" cx="100" cy="365" r="20"/>
  <text class="commit-text" x="100" y="365">A</text>
  <circle class="commit-main" cx="190" cy="365" r="20"/>
  <text class="commit-text" x="190" y="365">B</text>
  <circle class="commit-main" cx="300" cy="365" r="20"/>
  <text class="commit-text" x="300" y="365">C</text>
  <circle class="commit-main" cx="390" cy="365" r="20"/>
  <text class="commit-text" x="390" y="365">D</text>
  <circle class="commit-rebased" cx="520" cy="365" r="20"/>
  <text class="commit-text" x="520" y="365">F1'</text>
  <circle class="commit-rebased" cx="620" cy="365" r="20"/>
  <text class="commit-text" x="620" y="365">F2'</text>

  <rect class="note" x="60" y="415" width="860" height="68"/>
  <text class="text" x="85" y="444">Rebase keeps the content of your feature work, but recreates the commits on top of the latest `main`.</text>
  <text class="text" x="85" y="468">That is why commit IDs change, and why a branch that already exists on GitHub usually needs `git push --force-with-lease`.</text>
</svg>
